name: Compile and Deploy Production Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to release branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: release
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
